const geo = new THREE.PlaneGeometry(SIZE, SIZE, 1, 1);

// Infinity-mode animation state, shared across the three materials.
const uLineReveal = { value: 1 };   // 0..1 how far the gridlines have spread
const uCellReveal = { value: 1 };   // 0..1 how far the cells have filled in
const uLineDir    = { value: 1 };   // +1 spread outward, -1 arrive from outside
const uS          = { value: 1 };   // current plane scale (world coords)
const uMaxRadius  = { value: 10 };  // half the canvas diagonal, in world units
const uR0         = { value: 0.3 }; // radius of the original square's edge
const uSpan       = { value: 0.42 }; // width of each cell's fade-in window
const uFrame      = { value: 0.03 }; // half the outer frame line, in world units
// 1 while the composition is inflated to infinity. In standard mode the plane
// carries a half-frame margin of the *adjacent* pane's cells, which only the
// frame ink should cover; this gates a clip so those cells cannot leak past
// the border.
const uFill       = { value: 0 };
const uCellUVS    = { value: new THREE.Vector2(1, 1) };
const uLineUVS    = { value: new THREE.Vector2(1, 1) };const uInk        = { value: new THREE.Color('#0e0e0e') }; // line + black-cell ink
// Dark mode's negative, applied in the shaders rather than as a CSS filter on
// the WebGL canvas: 1 = inverted. The direct path inverts at the end of the
// plane shader (display space, where the CSS filter used to sit); the blur path
// renders true colours into `rtScene` and inverts once in `blurMixMat`.
const uInvert     = { value: 0 };
// 1 while the scene is captured into `rtScene`. That target is plain RGBA8, so
// the plane shader does the sRGB encode the canvas would otherwise get from
// three's output include — and, with no decode on sample, the capture holds
// exactly the bytes the canvas would.
const uCapture    = { value: 0 };
// Iridescent prism: a hue rotation about the grey axis, phased by how far a
// fragment sits from the tile centre, so dragging sweeps rainbow bands through
// the coloured cells. 0 is an exact no-op; the ink is neutral and never shifts.
const uPrism      = { value: 0 };
// Fixed painting frame, drawn from the frame map and faded in with the plate
// drift: each plate carries its own frame and drifts with it, so this is the
// copy that stays put, keeping the artwork's boundary framed as the grid moves.
const uFrameAmt   = { value: 0 };
// Sliding sheets: the horizontal drag is a velocity for the layers scrolling
// past each other, a misregistered print. It scrolls the texture offsets rather
// than the meshes — the maps wrap, so no edge can ever come into view — and the
// picker reads the same offsets, so clicks follow the scrolled pattern.
const SHEET_SPEED = 2.6;             // world units / second at a full drag

// The scene capture renders into a plain RGBA8 target, so the sRGB encode the
// canvas gets from three's output include has to happen in the shader instead
// (see the plane patch below). 8-bit perceptual, like KWin: in linear light a
// dark navy's green channel spans one or two codes, so the blobs would
// posterise and shimmer as they move.
const SRGB_ENCODE = `
    vec3 linearToSrgb(vec3 c){
      return mix(c * 12.92,
                 1.055 * pow(max(c, vec3(0.0)), vec3(1.0 / 2.4)) - 0.055,
                 step(vec3(0.0031308), c));
    }`;

const HALF = (SIZE / 2).toFixed(4);

// One layered plane: a Lambert material patched to composite the cell texture,
// the gridline texture and the radial infinity reveal. The per-plane maps live
// in their own uniform objects; every other uniform is shared by all planes.
function makePlane(slot){
  const lineMap   = { value: null };
  const frameMap  = { value: null };
  const revealMap = { value: null };
  const cellColor = { value: new THREE.Color(COLORS[slot]) }; // paletteNow[slot]
  const cellUVO   = { value: new THREE.Vector2() };           // per plane: centring + slide
  const lineUVO   = { value: new THREE.Vector2() };           // ...plus drift
  const frameUVO  = { value: new THREE.Vector2() };           // ...but drift never moves the frame
  const mat = new THREE.MeshLambertMaterial({
    alphaTest: 0.5, side: THREE.DoubleSide,
    // Premultiplied compositing on every path: the shader multiplies out by
    // alpha in display space (see the patch below), so the plane's own edge
    // pixels blend with the layers behind them and the canvas as a whole is
    // what the compositor expects. `premultipliedAlpha` stays off — that define
    // would premultiply inside the built-in chain, where the capture target is
    // still linear.
    blending: THREE.CustomBlending,
    blendEquation: THREE.AddEquation,
    blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
    blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor
  });

  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uLineMap    = lineMap;
    shader.uniforms.uFrameMap   = frameMap;
    shader.uniforms.uRevealMap  = revealMap;
    shader.uniforms.uLineReveal = uLineReveal;
    shader.uniforms.uCellReveal = uCellReveal;
    shader.uniforms.uLineDir    = uLineDir;
    shader.uniforms.uS          = uS;
    shader.uniforms.uMaxRadius  = uMaxRadius;
    shader.uniforms.uR0         = uR0;
    shader.uniforms.uSpan       = uSpan;
    shader.uniforms.uFrame      = uFrame;
    shader.uniforms.uFill       = uFill;
    shader.uniforms.uCellUVS    = uCellUVS;    // shared scale
    shader.uniforms.uCellUVO    = cellUVO;     // per plane, so sheets can slide
    shader.uniforms.uLineUVS    = uLineUVS;
    shader.uniforms.uLineUVO    = lineUVO;
    shader.uniforms.uFrameUVO   = frameUVO;
    shader.uniforms.uCellColor  = cellColor;
    shader.uniforms.uInk        = uInk;
    shader.uniforms.uInvert     = uInvert;
    shader.uniforms.uCapture    = uCapture;
    shader.uniforms.uPrism      = uPrism;
    shader.uniforms.uFrameAmt   = uFrameAmt;

    shader.vertexShader = shader.vertexShader
      .replace('void main() {', 'varying vec2 vUv;\nvarying vec2 vLocal;\nvoid main() {')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\n  vUv = uv;\n  vLocal = position.xy;');

    shader.fragmentShader = shader.fragmentShader
      .replace('void main() {',
        'uniform sampler2D uLineMap;\nuniform sampler2D uFrameMap;\nuniform sampler2D uRevealMap;\n' +
        'uniform vec2 uCellUVS;\nuniform vec2 uCellUVO;\n' +
        'uniform vec2 uLineUVS;\nuniform vec2 uLineUVO;\nuniform vec2 uFrameUVO;\n' +
        'uniform vec3 uCellColor;\nuniform vec3 uInk;\nuniform float uInvert;\nuniform float uCapture;\nuniform float uPrism;\nuniform float uFrameAmt;\n' +
        'uniform float uLineReveal;\nuniform float uCellReveal;\n' +
        'uniform float uLineDir;\nuniform float uS;\n' +
        'uniform float uMaxRadius;\nuniform float uR0;\nuniform float uSpan;\nuniform float uFrame;\nuniform float uFill;\n' +
        SRGB_ENCODE + '\n' +
        'varying vec2 vUv;\nvarying vec2 vLocal;\nvoid main() {')
      .replace('#include <map_fragment>', `#include <map_fragment>
  {
    vec2 uvC = vUv * uCellUVS + uCellUVO;
    vec2 uvL = vUv * uLineUVS + uLineUVO;
    vec2 uvF = vUv * uLineUVS + uFrameUVO;
    vec4 cellT = texture2D(map, uvC);
    // the cell map is a mask: white = palette fill, black = black cell
    vec3 cellRGB = mix(uInk, uCellColor, cellT.r);
    vec4 lineT = texture2D(uLineMap, uvL);
    // Ink coverage gain: a plate's line edges are sub-pixel soft, and where two
    // plates' lines overlap the two half-coverages leave a hairline of paper
    // down the middle of what should be one solid mark. INK_GAIN pushes the
    // partial coverages up so overlaps merge instead of outlining each other.
    lineT.a = min(1.0, lineT.a * ${INK_GAIN.toFixed(1)});
    vec4 rev = texture2D(uRevealMap, uvC);
    // where this fragment sits inside its own cell (-1..1, clamped so a cell
    // can never reach outside itself) and how far the cell's centre is from
    // the tile centre. The grow mask is cut from the cell's own rect, exactly
    // where the fill was drawn, so colours stay inside their grid cell.
    vec2 local = clamp(rev.rg * 2.0 - 1.0, -1.0, 1.0);
    vec2 wFrag = vLocal * uS;
    float insideF = step(abs(wFrag.x), ${HALF}) * step(abs(wFrag.y), ${HALF});
    float rF = length(wFrag) / max(uMaxRadius, 0.0001);
    float rOutF = clamp((rF - uR0) / max(1.0 - uR0, 0.0001), 0.0, 1.0);
    float rC = rev.b * ${(TILE_K * SIZE / 2).toFixed(4)} / max(uMaxRadius, 0.0001);
    float rOutC = clamp((rC - uR0) / max(1.0 - uR0, 0.0001), 0.0, 1.0);
    // the composition and the half frame line the plane carries outside it are
    // always drawn, so the border never thins while the infinity lines spread
    // outward or retract around it
    float insideL = step(abs(wFrag.x), ${HALF} + uFrame) * step(abs(wFrag.y), ${HALF} + uFrame);
    float lineA = insideL > 0.5 ? 1.0
                : (uLineDir > 0.0 ? step(rOutF, uLineReveal) : step(1.0 - uLineReveal, rOutF));
    // each cell fades in over its own window and grows into place, timed by
    // the radial wave — reads as the fill arriving from outside and settling.
    // The 1 + uSpan stretch lets the outermost cells finish exactly as
    // uCellReveal reaches 1, so the far corners are not left half tinted.
    float p = clamp((uCellReveal * (1.0 + uSpan) - rOutC) / uSpan, 0.0, 1.0);
    p = p * p * (3.0 - 2.0 * p);
    float grow = mix(0.22, 1.0, p);
    float covered = step(abs(local.x), grow) * step(abs(local.y), grow);
    // outside infinity the plane's half-frame margin carries the next pane's
    // cells; clip them to the composition so a frame drawn narrower than the
    // margin cannot let a sliver of the infinite grid show past it. The mask
    // must gate the cell's rgb as well as its alpha: this composite adds
    // cellRGB unweighted by its own coverage, so zeroing cellA alone still
    // leaks the colour into the frame's AA edge as a one-pixel tint.
    float cellMask = mix(insideF, 1.0, uFill);
    float cellA = (insideF > 0.5 ? 1.0 : covered * p) * cellMask;
    vec4 comp = vec4(lineT.rgb, lineT.a * lineA)
              + vec4(cellRGB * cellMask, cellT.a * cellA) * (1.0 - lineT.a * lineA);
    // the plates' own frames live in their line maps and drift with them; this
    // is the fixed copy, faded in with the drift so the painting stays framed
    vec4 frameT = texture2D(uFrameMap, uvF);
    float frameA = min(1.0, frameT.a * ${INK_GAIN.toFixed(1)}) * lineA * uFrameAmt;
    comp = vec4(frameT.rgb * frameA, frameA) + comp * (1.0 - frameA);
    // iridescence: rotate hue about the grey axis (the ink is neutral, so the
    // black lines never shift), phased across the plane so the drag sweeps
    // rainbow bands through the composition — the bands turn with the artwork.
    // uPrism = 0 is an exact no-op.
    if (uPrism != 0.0){
      float a = uPrism * (0.5 + 0.5 * clamp(vLocal.y / ${HALF}, -1.0, 1.0));
      float ca = cos(a), sa = sin(a);
      vec3 k = vec3(0.5773502692);
      vec3 tint = comp.rgb * ca + cross(k, comp.rgb) * sa + k * dot(k, comp.rgb) * (1.0 - ca);
      comp = vec4(clamp(tint, 0.0, 1.0), comp.a);
    }
    diffuseColor = vec4(diffuse, opacity) * comp;
  }`)
      // The capture target is plain RGBA8, so encode sRGB here (uCapture); on
      // the canvas the include already did. Then the negative, in display space
      // where filter:invert(1) used to sit, and premultiply for the compositor:
      // both paths hold the same bytes, so the focus pull can engage or release
      // without a step.
      .replace('#include <colorspace_fragment>', `#include <colorspace_fragment>
  if (uCapture > 0.5) gl_FragColor.rgb = linearToSrgb(gl_FragColor.rgb);
  gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(1.0) - gl_FragColor.rgb, uInvert);
  gl_FragColor.rgb *= gl_FragColor.a;`);
  };

  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
  return { mesh, mat, lineMap, frameMap, revealMap, cellColor, cellUVO, lineUVO, frameUVO };
}

const planes = [0, 1, 2].map(i => {
  const pl = Object.assign(makePlane(i), { slot: i, i, depth: i, pose: randomPose(i) });
  pl.mesh.userData.plane = pl;
  return pl;
});

function randomPose(depth){
  const rand = (a, b) => a + Math.random() * (b - a);
  return {
    x: (depth - 1) * rand(0.30, 0.55) + rand(-0.15, 0.15),
    y: rand(-0.5, 0.5),
    z: (depth - 1) * 0.85,
    rx: rand(-11, 11) * DEG,
    ry: rand(-11, 11) * DEG,
    rz: rand(-12, 12) * DEG
  };
}

/* ------------------------------------------------------------------ *
 *  Camera views + smoothing
 * ------------------------------------------------------------------ */

// Every view is a point on a turntable around the artwork, which always
// pivots on its own centre (the world origin):
//   theta   azimuth around the vertical (Y) axis  -> clean horizontal yaw
//   phi     polar angle from +Y (PI/2 = facing the camera)
//   spread  1 = grids fanned out through depth, 0 = perfectly aligned
//   explode 1 = grids laid out side by side, flat and non-overlapping
const VIEW3D    = { theta: 0.70, phi: 1.08, spread: 1, explode: 0 };
const VIEWTOP   = { theta: 0.00, phi: Math.PI / 2, spread: 0, explode: 0 };
const VIEWSPLIT = { theta: 0.00, phi: Math.PI / 2, spread: 0, explode: 1 };

const cur = Object.assign({ dist: 12, rise: 0, fill: 0 }, VIEW3D);
const dst = Object.assign({ dist: 12, rise: 0, fill: 0 }, VIEW3D);
const dists = { d3d: 12.6, dtop: 9, dsplit: 18, fillScale: 2 };

function applyCamera(v){
  const { theta: t, phi: p, dist: d } = v;
  camera.position.set(
    d * Math.sin(p) * Math.sin(t),
    d * Math.cos(p),
    d * Math.sin(p) * Math.cos(t)
  );
  camera.up.set(0, 1, 0);
  camera.lookAt(0, 0, 0);
}

// distance needed to fit a world extent (full width / height) in frame
function distToFit(needW, needH){
  const half = Math.tan(camera.fov * DEG / 2);
  return Math.max(needH / (2 * half), needW / (2 * half * camera.aspect));
}

// how far the artwork has to travel to be clear of the frame at this camera
// distance — its own half height (plus a little for the tilt of the fanned
// planes) and some air
function clearLift(dist){
  return Math.max(LIFT, dist * Math.tan(camera.fov * DEG / 2) + SIZE * 0.6 + 1.2);
}

// side-by-side layout direction follows the viewport shape
function explodeAxis(){
  return camera.aspect >= 1 ? { dx: SIZE * 1.12, dy: 0 } : { dx: 0, dy: SIZE * 1.12 };
}

function fitViews(){
  dists.d3d  = Math.max(12.6, distToFit(SIZE * 1.5, SIZE * 1.5));
  dists.dtop = Math.max(9.0,  distToFit(SIZE * 1.38, SIZE * 1.38));
  const ax = explodeAxis();
  const spanX = Math.abs(ax.dx) * 2 + SIZE;
  const spanY = Math.abs(ax.dy) * 2 + SIZE;
  dists.dsplit = distToFit(spanX * 1.12, spanY * 1.12);

  // how much a plane must grow so its pattern reaches the viewport edges
  const visH = 2 * dists.dtop * Math.tan(camera.fov * DEG / 2);
  const visW = visH * camera.aspect;
  dists.fillScale = Math.max(visW, visH) * 1.06 / SIZE;
  uMaxRadius.value = 0.5 * Math.hypot(visW, visH);
  uR0.value = (SIZE * 0.5) / uMaxRadius.value;
}

const toggleBtn   = document.getElementById('toggle');
const explodeBtn  = document.getElementById('explode');
const infinityBtn = document.getElementById('infinity');
let mode = '3d';
let infT = 0;              // seconds since infinity mode was entered

// Title-click turntable, infinity mode only: the artwork spins slowly in its
// own plane while the focus pull sits at max; a second click eases it back to
// the nearest full turn and releases the blur. Declared here because
// `reveal()` runs at boot, before the interaction handlers exist.
const TAU = Math.PI * 2;
const SPIN_RATE = 6 * DEG;               // rad/s, one slow turn every ~60s
let spinning = false, spinAngle = 0, spinRate = 0, spinGoal = null;

function stopSpin(){
  if (!spinning) return;
  spinning = false;
  spinGoal = Math.round(spinAngle / TAU) * TAU;
}

// Outside infinity the same click toggles plate drift: each layer slides its
// whole print — fills and gridlines together, a rigid plate — along its own
// slow two-axis path, so the plates wander out of register and back and the
// composition keeps re-forming. Switching it off eases every plate home.
// Declared here because the click handler and the frame loop both need it,
// and it sits next to the spin switch it replaces outside infinity.
const DRIFT_CELLS = 0.18;                // peak plate displacement, in grid cells
let drifting = false, driftAmt = 0, driftT = 0;
let driftPaths = null;                   // per plane: {ax, ay, fx, fy, px, py}

function driftRandomize(){
  driftPaths = planes.map(() => ({
    ax: DRIFT_CELLS * (0.65 + Math.random() * 0.35),
    ay: DRIFT_CELLS * (0.65 + Math.random() * 0.35),
    fx: 0.022 + Math.random() * 0.028,   // cycles / second, periods ~18-45s
    fy: 0.022 + Math.random() * 0.028,
    px: Math.random(), py: Math.random()
  }));
}

function toggleDrift(){
  if (reduceMotion) return;              // the title gradient drift is skipped too
  drifting = !drifting;
  // only re-roll once the plates are fully home: switching back on mid-return
  // must resume the same path, or the displacement would jump
  if (drifting && driftAmt === 0){ driftT = 0; driftRandomize(); }
}

// Iridescent prism and sliding sheets state, also declared up here because
// `applyTitlePalette()` reads `prismCur` and boots before the interaction
// handlers exist. The infinity drag owns both axes: vertical = prism,
// horizontal = the sheets' sliding velocity.
const PRISM_MAX = Math.PI;               // ±180deg for a full-height drag
let prismDst = 0, prismCur = 0, infinityDrag = false, dragMoved = false;
let dragY0 = 0, prismStart = 0;
let titlePrism = -1;                     // last prism value the title was drawn with
let sheetOffset = 0;                     // accumulated slide, world units
// One exact repeat of both maps: the cell meta-tile is K squares across and the
// line tile one, so the whole pattern repeats every K squares of slide. The exit
// whizz back wraps the accumulated offset by this, so a run that has been
// sliding for minutes cannot leave the plates hundreds of units out to crawl
// home — after the wrap every plate starts from within K/2 squares of register.
const SHEET_WRAP = SIZE * TILE_K;        // world units per exact map repeat
let sheetVel = 0, sheetVelDst = 0;       // world units / second
let sheetVelStart = 0;                   // speed at pointer-down (jog origin)
let sheetBraking = false;                // coasting smoothly to a stop
let sheetReturning = false;              // whizzing back to registration
let dragX0 = 0;

function updateToggleIcon(){
  // show the grid icon (i.e. "press to collapse to top") unless we are
  // already sitting in the aligned top view or the exploded row
  toggleBtn.classList.toggle('is-top', mode !== 'top' && mode !== 'split');
}

function setMode(next){
  document.body.classList.remove('infinity');
  infinityBtn.classList.remove('is-on');
  uLineReveal.value = 1;      // everything shown outside infinity mode
  uCellReveal.value = 1;
  mode = next;
  updateToggleIcon();
  explodeBtn.classList.toggle('is-split', next === 'split');

  const src = next === '3d' ? VIEW3D : next === 'split' ? VIEWSPLIT : VIEWTOP;
  dst.theta   = src.theta;
  dst.phi     = src.phi;
  dst.spread  = src.spread;
  dst.explode = src.explode;
  dst.dist    = next === '3d' ? dists.d3d : next === 'split' ? dists.dsplit : dists.dtop;
  dst.fill    = 0;
  blurDst     = 0;                 // leaving infinity always returns to sharp
  prismDst    = 0;                 // ...and to true colours...
  sheetVelDst = 0;                 // ...and the sheets whizz back to register
  // wrap to the equivalent offset nearest home first: the return speed is
  // capped, and after a long slide the accumulated offset can be hundreds of
  // world units out (see SHEET_WRAP). Integer multiples of the wrap are
  // visually identical, so this cannot pop.
  sheetOffset = ((sheetOffset + SHEET_WRAP / 2) % SHEET_WRAP + SHEET_WRAP) % SHEET_WRAP
              - SHEET_WRAP / 2;
  sheetReturning = true;
  stopSpin();
}

function reveal(){
  // Start clear of the frame in the layered 3D pose, then levitate up *while*
  // rotating to face the camera and collapsing — one continuous motion. All of
  // it happens off-screen, so the swap is never seen to jump.
  Object.assign(cur, VIEW3D); cur.dist = dists.d3d;
  cur.rise = clearLift(dists.d3d) / LIFT;
  Object.assign(dst, VIEWTOP); dst.dist = dists.dtop; dst.rise = 0;
  dst.fill = 0;
  blurDst = 0;
  stopSpin();
  mode = 'top';
  document.body.classList.remove('infinity');
  infinityBtn.classList.remove('is-on');
  uLineReveal.value = 1;
  uCellReveal.value = 1;
  updateToggleIcon();
  explodeBtn.classList.remove('is-split');
}

// Infinity mode: the flat composition stays put while its repeating grid
// spreads outward past the frame to the edges of the canvas — first the
// black lines (from the centre out, or in from the edges), then the cells.
function enterInfinity(){
  mode = 'infinity';
  infT = 0;
  document.body.classList.add('infinity');
  infinityBtn.classList.add('is-on');
  updateToggleIcon();

  dst.theta = VIEWTOP.theta; dst.phi = VIEWTOP.phi;
  dst.spread = 0; dst.explode = 0;
  dst.dist = dists.dtop;
  dst.fill = 1;                       // pattern tiles, so this is not a zoom
  cur.fill = 1;                       // apply immediately (visually identical)

  uLineDir.value = Math.random() < 0.5 ? 1 : -1;   // outward or from the edges
  uLineReveal.value = 0;
  uCellReveal.value = 0;
  titleRandomize();
}

function toggleInfinity(){
  if (mode === 'infinity') setMode('top');
  else enterInfinity();
}

/* ------------------------------------------------------------------ *
 *  Title: palette gradient on a black plate (infinity mode only)
 * ------------------------------------------------------------------ */

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const tRnd = (a, b) => a + Math.random() * (b - a);

const TITLE = {
  pie:    document.getElementById('tg-pie'),
  wedges: [1, 2, 3].map(i => document.getElementById('tg-w' + i)),
  blobs:  [1, 2, 3].map(i => document.getElementById('tg-b' + i)),
  grads:  [1, 2, 3].map(i => document.getElementById('tg-g' + i)),
  wedgeSlot: null,
  blobSlot:  null,
  fx: null
};

// one slice of the rotating conic base
function wedgePath(cx, cy, r, a0, a1){
  const rad = a => a * DEG;
  const x0 = cx + r * Math.cos(rad(a0)), y0 = cy + r * Math.sin(rad(a0));
  const x1 = cx + r * Math.cos(rad(a1)), y1 = cy + r * Math.sin(rad(a1));
  return `M${cx} ${cy}L${x0.toFixed(1)} ${y0.toFixed(1)}` +
         `A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z`;
}

// a fresh palette gradient for each engagement of infinity mode
function titleRandomize(){
  // which palette slot lands in which wedge / blob; the colours themselves
  // come from applyTitlePalette(), so they can keep tweening on a retune
  TITLE.wedgeSlot = shuffled([0, 1, 2]);
  TITLE.blobSlot  = shuffled([0, 1, 2]);

  const s1 = 120 + tRnd(-28, 28), s2 = 240 + tRnd(-28, 28);
  const cuts = [0, s1, s2, 360];
  TITLE.wedges.forEach((w, i) => {
    w.setAttribute('d', wedgePath(100, 54, 180, cuts[i], cuts[i + 1]));
  });

  const blobBase = [];
  TITLE.blobs.forEach((b, i) => {
    b.setAttribute('cx', tRnd(10, 190).toFixed(1));
    b.setAttribute('cy', tRnd(-5, 113).toFixed(1));
    const r0 = tRnd(44, 80);
    blobBase.push(r0);
    b.setAttribute('r', r0.toFixed(1));
    b.removeAttribute('transform');
    TITLE.grads[i].children[1].setAttribute('offset', tRnd(0.32, 0.68).toFixed(2));
  });

  TITLE.fx = {
    a0: tRnd(0, 360),                                        // start angle
    spin: tRnd(12, 22) * (Math.random() < 0.5 ? -1 : 1),     // degrees / second
    t: 0,
    blobs: TITLE.blobs.map((b, i) => ({
      r0: blobBase[i],                                       // base radius
      ax: tRnd(18, 38), ay: tRnd(14, 32),                    // orbit radii
      fx: tRnd(0.07, 0.15), fy: tRnd(0.07, 0.15),            // orbit speeds (Hz)
      px: tRnd(0, Math.PI * 2), py: tRnd(0, Math.PI * 2),
      rp: tRnd(0.06, 0.15), rf: tRnd(0.05, 0.12),            // radius breathing
      rph: tRnd(0, Math.PI * 2)
    }))
  };
  TITLE.pie.setAttribute('transform', `rotate(${TITLE.fx.a0} 100 54)`);
  applyTitlePalette();
}

function titleTick(dt){
  // the gradient only drifts while infinity mode is on
  if (mode === 'infinity' && TITLE.fx && !reduceMotion){
    const fx = TITLE.fx;
    fx.t += dt;
    TITLE.pie.setAttribute('transform', `rotate(${(fx.a0 + fx.spin * fx.t) % 360} 100 54)`);
    TITLE.blobs.forEach((b, i) => {
      const d = fx.blobs[i];
      const dx = d.ax * Math.cos(d.px + fx.t * 2 * Math.PI * d.fx);
      const dy = d.ay * Math.sin(d.py + fx.t * 2 * Math.PI * d.fy);
      const r  = d.r0 * (1 + d.rp * Math.sin(d.rph + fx.t * 2 * Math.PI * d.rf));
      b.setAttribute('transform', `translate(${dx.toFixed(2)} ${dy.toFixed(2)})`);
      b.setAttribute('r', r.toFixed(1));
    });
  }
}

// the clip is cut from live text, so nudge it once the webfont has settled
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(() => {
    const clipped = document.querySelector('.title-svg [clip-path]');
    if (!clipped) return;
    clipped.removeAttribute('clip-path');
    void clipped.getBoundingClientRect();
    clipped.setAttribute('clip-path', 'url(#tg-clip)');
  });
}

/* ------------------------------------------------------------------ *
 *  Shuffle: a vertical conveyor
 * ------------------------------------------------------------------ */

// The composition on screen floats up and off the top; only then — while the
// frame is empty, so nothing can be seen to jump — is the next one placed below
// it, to rise into view. One composition is ever in flight, so hammering the
// button cannot pile them up.
let shufflePhase = 'idle';   // idle | out | in
let shuffleT = 0;            // seconds into the exit
let exitLift = LIFT;         // world units the exit travels
let exitRise = 0;            // 0..1 exit progress
let pending = null;          // next composition, built at click time

// Build a whole new composition without showing it yet. The texture work is the
// slow part, so it happens on the click rather than mid-transition.
function buildComposition(){
  const slotOrder  = shuffled([0, 1, 2]);     // which palette slot sits in which layer
  const depthOrder = shuffled([0, 1, 2]);     // which layer sits where in depth
  const frame = 9 + Math.random() * 7;

  // Every layer draws its own cartesian grid, so the three films never line up:
  // the black you see is the union of all three, and a colour block can be cut
  // by a line belonging to another layer. Cells still can't spill across their
  // own layer's lines — each fill and its reveal mask share the same cuts.
  //
  // The composition's outer frame weight is shared by every layer, so the plane
  // can carry exactly half of it outside the composition (see the render loop)
  // and the border looks the same in every view.
  return planes.map(pl => {
    const slot = slotOrder[pl.i];
    const depth = depthOrder[pl.i];
    const nc = 3 + Math.floor(Math.random() * 4); // 3..6 columns
    const nr = 3 + Math.floor(Math.random() * 4); // 3..6 rows
    const v = randCuts(nc, 0.07);
    const h = randCuts(nr, 0.07);
    return {
      slot, depth, frame, pose: randomPose(depth),
      tex: makeGridTexture(maxAniso, v, h, frame)
    };
  });
}

// The exit dissolves the artwork, which needs real blending — the material's
// alphaTest would otherwise cut the fade off at 50%. Toggling it costs one
// shader variant, cached after the first shuffle.
function setArtworkFade(fading, fade){
  for (const pl of planes){
    const m = pl.mat;
    if (fading !== (m.alphaTest === 0)){
      m.transparent = fading;
      m.alphaTest = fading ? 0 : 0.5;
      m.depthWrite = !fading;      // let the layers blend rather than occlude
      m.needsUpdate = true;
    }
    m.opacity = fade;
  }
}

// move the pending composition onto the live planes, then let it rise in
function swapIn(){
  for (const pl of planes){
    const n = pending[pl.i];
    [pl.mat.map, pl.lineMap.value, pl.frameMap.value, pl.revealMap.value]
      .forEach(t => t && t.dispose());
    pl.slot = n.slot;
    pl.depth = n.depth;
    pl.pose = n.pose;
    pl.mat.map = n.tex.cell;
    pl.lineMap.value = n.tex.line;
    pl.frameMap.value = n.tex.frame;
    pl.revealMap.value = n.tex.reveal;
    pl.mat.needsUpdate = true;
  }
  frameW = pending[0].frame;
  pending = null;
  exitRise = 0;
  setArtworkFade(false, 1);
  applyPalette();          // the new layers pick up the current palette
  reveal();
  shufflePhase = 'in';
}

function shuffle(){
  if (shufflePhase === 'out') return;      // already leaving; let it finish
  if (pending) for (const n of pending)    // a newer click replaced the queue
    [n.tex.cell, n.tex.line, n.tex.frame, n.tex.reveal].forEach(t => t.dispose());
  pending = buildComposition();

  if (!planes[0].mat.map){ swapIn(); return; }   // first run: nothing to send off
  exitLift = clearLift(cur.dist) + LIFT * cur.rise;
  exitRise = 0;
  shuffleT = 0;
  dst.rise = cur.rise;                     // hold the entrance if it is mid-flight
  shufflePhase = 'out';
  setArtworkFade(true, 1);
}

/* ------------------------------------------------------------------ *
 *  Paper grain
 * ------------------------------------------------------------------ */

// 128px noise tile behind the CSS `body::after` overlay. Sitting outside
// #stage is deliberate: a focus pull blurs the artwork, never the grain.
(function makeGrain(){
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(c.width, c.height);
  for (let i = 0; i < img.data.length; i += 4){
    const v = 255 - (Math.random() * 46 | 0);   // white base, dark speckles
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  document.documentElement.style.setProperty('--grain', `url(${c.toDataURL()})`);
})();

/* ------------------------------------------------------------------ *
 *  Focus pull: dual-Kawase blur, canvas only
 * ------------------------------------------------------------------ */

// Konsole/Yakuake's frosted glass comes from KWin's blur effect, which is a
// dual-Kawase pyramid rather than a Gaussian: capture the frame once, run a
// 5-tap cross downsample 1..5 times, then carry it back up with an 8-tap ring
// and blend the result over the sharp frame. A handful of taps reach a much
// wider radius than a separable Gaussian, which is where the terminal's
// smoothness comes from. Only the WebGL canvas blurs: the title, controls and
// grain are DOM and stay sharp. At rest the whole path is skipped and the
// canvas draws directly with MSAA.

const BLUR_MAX_ITER = 5;                // pyramid down to 1/32 resolution
// KWin's blur-strength table ({iteration, offset} pairs, 15 steps across the
// four iteration bands), generated the same way, plus the fifth band KWin left
// commented out in their source ({5, 10}) — that extension is what takes the
// top of the drag from "soft focus" to properly blobby.
const BLUR_PRESETS = (() => {
  const ranges = [
    { min: 1, max: 2 },                 // downsample 1/2
    { min: 2, max: 3 },                 // downsample 1/4
    { min: 2, max: 5 },                 // downsample 1/8
    { min: 3, max: 8 }                  // downsample 1/16
  ];
  const steps = 15;
  const spread = ranges.reduce((s, r) => s + (r.max - r.min), 0);
  const out = [];
  let left = steps;
  ranges.forEach((r, i) => {
    let n = Math.ceil((r.max - r.min) / spread * steps);
    left -= n;
    if (left < 0){ n += left; left = 0; }
    for (let j = 1; j <= n; j++)
      out.push({ iters: i + 1, offset: r.min + (r.max - r.min) / n * j });
  });
  for (const offset of [6, 8, 10]) out.push({ iters: 5, offset });   // 1/32
  return out;
})();
const BLUR_TOP_PRESET = 17;             // the deepest band melts everything
// Effective radius of each preset (offset in texels of its coarsest level,
// times that level's downscale). The drag sweeps radius geometrically and
// crossfades the two bracketing strengths, so a level-count change never pops.
const BLUR_RADII = BLUR_PRESETS.map(p => p.offset * (1 << p.iters));
const BLUR_R_MIN = BLUR_RADII[0];
const BLUR_R_MAX = BLUR_RADII[BLUR_TOP_PRESET];

const rtScene = new THREE.WebGLRenderTarget(1, 1, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat, depthBuffer: true, stencilBuffer: false
});
// Plain RGBA8 on purpose: the plane shader encodes sRGB itself while capturing
// (uCapture), so sampling decodes nothing and the capture holds exactly the
// bytes the canvas would — premultiplied display values, with no round trip.

// The pyramid: half, quarter, eighth, sixteenth and thirty-second of the
// drawbuffer. Two sets so the bracketing strengths can be crossfaded.
const makeBlurLevel = () => new THREE.WebGLRenderTarget(1, 1, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat, depthBuffer: false, stencilBuffer: false
});
const blurChainA = Array.from({ length: BLUR_MAX_ITER }, makeBlurLevel);
const blurChainB = Array.from({ length: BLUR_MAX_ITER }, makeBlurLevel);

// KWin's noise pass: a static screen-space grain added over the blurred result
// to mask the banding and chunkiness the pyramid leaves behind. Their default
// strength is 5, so the texture carries 0..4 and lands as up to four 8-bit
// steps of display-space brightening (about 0.8 of a step on average). One
// texel is one CSS pixel, like KWin scales it by the DPI.
const BLUR_NOISE = 5;
const blurNoiseTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(c.width, c.height);
  for (let i = 0; i < img.data.length; i += 4){
    const v = Math.random() * BLUR_NOISE | 0;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.NoColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.minFilter = tex.magFilter = THREE.NearestFilter;
  return tex;
})();

const BLUR_VERT = `
  varying vec2 vUv;
  void main(){
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }`;

// KWin's blur is sRGB-space, and this must be too, so every pass quantises
// perceptually evenly and the shadow end survives: a dark navy's green channel
// spans one or two codes in linear light, and the blobs would posterise and
// shimmer as they move. The capture holds display-space bytes (the plane shader
// encoded them), so the chain just averages those bytes, premultiplied — the
// same way the compositor would, and the way KWin blurs its own sRGB output.
const blurDownMat = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: null },
    uHalfpixel: { value: new THREE.Vector2() },
    uOffset: { value: 1 }
  },
  vertexShader: BLUR_VERT,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform vec2 uHalfpixel;
    uniform float uOffset;
    varying vec2 vUv;
    void main(){
      vec4 sum = texture2D(tDiffuse, vUv) * 4.0;
      sum += texture2D(tDiffuse, vUv - uHalfpixel * uOffset);
      sum += texture2D(tDiffuse, vUv + uHalfpixel * uOffset);
      sum += texture2D(tDiffuse, vUv + vec2(uHalfpixel.x, -uHalfpixel.y) * uOffset);
      sum += texture2D(tDiffuse, vUv - vec2(uHalfpixel.x, -uHalfpixel.y) * uOffset);
      gl_FragColor = sum / 8.0;
    }`,
  depthTest: false, depthWrite: false, blending: THREE.NoBlending
});

// KWin's 8-tap ring (axis taps at two halfpixels, diagonal taps at one,
// weighted twice), emitted as an expression so a pass can use it on whichever
// texture/uniform pair it reads.
const ringSum = (tex, off) => `
      texture2D(${tex}, vUv + vec2(-uHalfpixel.x * 2.0, 0.0) * ${off})
    + texture2D(${tex}, vUv + vec2(-uHalfpixel.x, uHalfpixel.y) * ${off}) * 2.0
    + texture2D(${tex}, vUv + vec2(0.0, uHalfpixel.y * 2.0) * ${off})
    + texture2D(${tex}, vUv + vec2(uHalfpixel.x, uHalfpixel.y) * ${off}) * 2.0
    + texture2D(${tex}, vUv + vec2(uHalfpixel.x * 2.0, 0.0) * ${off})
    + texture2D(${tex}, vUv + vec2(uHalfpixel.x, -uHalfpixel.y) * ${off}) * 2.0
    + texture2D(${tex}, vUv + vec2(0.0, -uHalfpixel.y * 2.0) * ${off})
    + texture2D(${tex}, vUv + vec2(-uHalfpixel.x, -uHalfpixel.y) * ${off}) * 2.0`;

const blurUpMat = new THREE.ShaderMaterial({
  uniforms: {
    tBlur: { value: null },
    uHalfpixel: { value: new THREE.Vector2() },
    uOffset: { value: 1 }
  },
  vertexShader: BLUR_VERT,
  fragmentShader: `
    uniform sampler2D tBlur;
    uniform vec2 uHalfpixel;
    uniform float uOffset;
    varying vec2 vUv;
    void main(){
      gl_FragColor = (${ringSum('tBlur', 'uOffset')}) / 12.0;
    }`,
  depthTest: false, depthWrite: false, blending: THREE.NoBlending
});

// The onscreen pass is KWin's ring once more, applied to each of the two
// bracketing blur strengths and crossfaded, then faded against the sharp frame
// so the focus pull engages and releases without a step. Everything here is
// premultiplied display bytes — the chain blurred them and the capture wrote
// them — so partial alpha is convolved the way the compositor would, and the
// negative is `alpha - colour`: inverting straight RGB as if it were a
// full-coverage pixel is what used to turn every partly transparent pixel into
// a white halo, and the whole background with it.
const blurMixMat = new THREE.ShaderMaterial({
  uniforms: {
    tBlurA: { value: null },
    tBlurB: { value: null },
    tSharp: { value: null },
    tNoise: { value: blurNoiseTex },
    uHalfpixel: { value: new THREE.Vector2() },
    uOffsetA: { value: 1 },
    uOffsetB: { value: 1 },
    uCross: { value: 0 },
    uMix: { value: 0 },
    uNoiseScale: { value: 1 / 256 },
    uInvert: { value: 0 }
  },
  vertexShader: BLUR_VERT,
  fragmentShader: `
    uniform sampler2D tBlurA;
    uniform sampler2D tBlurB;
    uniform sampler2D tSharp;
    uniform sampler2D tNoise;
    uniform vec2 uHalfpixel;
    uniform float uOffsetA;
    uniform float uOffsetB;
    uniform float uCross;
    uniform float uMix;
    uniform float uNoiseScale;
    uniform float uInvert;
    varying vec2 vUv;
    void main(){
      vec4 blurA = (${ringSum('tBlurA', 'uOffsetA')}) / 12.0;
      vec4 blurB = (${ringSum('tBlurB', 'uOffsetB')}) / 12.0;
      vec4 sharp = texture2D(tSharp, vUv);
      vec4 col = mix(sharp, mix(blurA, blurB, uCross), uMix);
      // noise scales with coverage so it belongs to the artwork, never to the
      // paper showing through
      vec3 outCol = col.rgb
                  + texture2D(tNoise, gl_FragCoord.xy * uNoiseScale).rrr * uMix * col.a;
      gl_FragColor = vec4(mix(outCol, vec3(col.a) - outCol, uInvert), col.a);
    }`,
  depthTest: false, depthWrite: false, blending: THREE.NoBlending
});

const blurQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blurDownMat);
blurQuad.frustumCulled = false;
const blurScene = new THREE.Scene();
blurScene.add(blurQuad);
const blurCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const _dbSize = new THREE.Vector2();

// One full-screen pass. `halfpixel` is half a texel of the texture being read,
// exactly as KWin computes it per pass.
function blurPass(mat, src, offset, dst){
  if (mat.uniforms.tBlur) mat.uniforms.tBlur.value = src.texture;
  else if (mat.uniforms.tDiffuse) mat.uniforms.tDiffuse.value = src.texture;
  mat.uniforms.uHalfpixel.value.set(0.5 / src.width, 0.5 / src.height);
  if (mat.uniforms.uOffset) mat.uniforms.uOffset.value = offset;
  blurQuad.material = mat;
  renderer.setRenderTarget(dst);
  renderer.render(blurScene, blurCam);
}

// Downsample to the preset's depth, then carry it back up; the result lands in
// levels[0], half resolution, ready for the onscreen ring.
function runBlurChain(levels, preset){
  let src = rtScene;
  for (let i = 0; i < preset.iters; i++){
    blurPass(blurDownMat, src, preset.offset, levels[i]);
    src = levels[i];
  }
  for (let i = preset.iters - 1; i > 0; i--)
    blurPass(blurUpMat, levels[i], preset.offset, levels[i - 1]);
}

function renderScene(){
  if (blurCur < 0.05){                     // sharp: draw straight to the canvas
    uInvert.value = darkOn ? 1 : 0;        // the plane shader carries the negative
    uCapture.value = 0;                    // the include encodes sRGB for us
    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
    return;
  }
  // the blur path renders true colours and inverts once, at the end
  uInvert.value = 0;
  uCapture.value = 1;                      // plain RGBA8 capture: encode here

  // The drag sweeps the blur radius geometrically — a constant ratio per unit
  // of drag, which is what reads as an even scale — and the two bracketing
  // KWin strengths are crossfaded, so the pyramid's level changes never step.
  const s = Math.min(1, blurCur / blurMaxPx());
  const radius = BLUR_R_MIN * Math.pow(BLUR_R_MAX / BLUR_R_MIN, s);
  let i = 0;
  while (i < BLUR_TOP_PRESET && BLUR_RADII[i + 1] < radius) i++;
  const j = Math.min(i + 1, BLUR_TOP_PRESET);
  const r0 = BLUR_RADII[i], r1 = BLUR_RADII[j];
  const cross = j > i && r1 > r0
    ? Math.min(1, Math.max(0, (radius - r0) / (r1 - r0)))
    : 0;

  renderer.setRenderTarget(rtScene);
  renderer.render(scene, camera);

  runBlurChain(blurChainA, BLUR_PRESETS[i]);
  const mixing = cross > 0.001;
  if (mixing) runBlurChain(blurChainB, BLUR_PRESETS[j]);

  const read = blurChainA[0];
  blurMixMat.uniforms.tBlurA.value = read.texture;
  blurMixMat.uniforms.tBlurB.value = mixing ? blurChainB[0].texture : read.texture;
  blurMixMat.uniforms.uOffsetA.value = BLUR_PRESETS[i].offset;
  blurMixMat.uniforms.uOffsetB.value = BLUR_PRESETS[j].offset;
  blurMixMat.uniforms.uCross.value = mixing ? cross : 0;
  blurMixMat.uniforms.tSharp.value = rtScene.texture;
  blurMixMat.uniforms.uMix.value = Math.min(1, blurCur / 1.5);
  blurMixMat.uniforms.uNoiseScale.value = 1 / (256 * renderer.getPixelRatio());
  blurMixMat.uniforms.uInvert.value = darkOn ? 1 : 0;
  blurPass(blurMixMat, read, 1, null);
}

/* ------------------------------------------------------------------ *
 *  Interaction
 * ------------------------------------------------------------------ */

let dragging = false, lastX = 0, lastY = 0;
// Two drags share the pointer: outside infinity it orbits the camera, inside
// it is the iridescent prism (the camera deliberately ignores infinity mode,
// so this input was free). The blur is no longer draggable — the title switch
// holds it at max and the wheel trims it. The prism sticks where you leave it;
// leaving infinity is what resets it.
let blurDst = 0, blurCur = 0;
const blurMaxPx = () =>
  Math.min(20, Math.max(8, Math.min(window.innerWidth, window.innerHeight) * 0.024));
// A small deadzone per drag axis in infinity, so taps and single-axis
// adjustments stay clean: an axis only wakes past this many pixels, and the
// excess is measured from the edge so nothing jumps when it does.
const DRAG_DEADZONE = 10;
const pastDeadzone = v => Math.sign(v) * Math.max(0, Math.abs(v) - DRAG_DEADZONE);
const dom = renderer.domElement;

dom.addEventListener('pointerdown', e => {
  if (mode === 'infinity'){
    infinityDrag = true; dragMoved = false;
    dragY0 = e.clientY; prismStart = prismCur;
    dragX0 = e.clientX;
    sheetReturning = false;                          // grab the sheets again...
    sheetBraking = false;                            // ...at their current speed
    sheetVelStart = sheetVel;                        // the jog starts from here
    sheetVelDst = sheetVel;                          // ...so a vertical drag leaves it alone
    dom.setPointerCapture(e.pointerId);
    return;
  }
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  dom.setPointerCapture(e.pointerId);
});
dom.addEventListener('pointermove', e => {
  if (infinityDrag){
    if (mode !== 'infinity'){ infinityDrag = false; return; }
    const dy = dragY0 - e.clientY;                   // drag up = prism forward
    const dx = e.clientX - dragX0;                   // drag right = sheets slide
    if (Math.abs(dy) > DRAG_DEADZONE || Math.abs(dx) > DRAG_DEADZONE) dragMoved = true;
    if (dragMoved){
      // each axis is measured past its own deadzone, so a drag meant for one
      // axis leaves the other exactly where it was
      prismDst = Math.min(PRISM_MAX, Math.max(-PRISM_MAX,
        prismStart + pastDeadzone(dy) / (0.45 * window.innerHeight) * PRISM_MAX));
      // the horizontal axis jogs the sheets' speed from wherever it already is,
      // so a purely vertical drag (adjusting the prism) never disturbs them
      sheetVelDst = Math.min(SHEET_SPEED, Math.max(-SHEET_SPEED,
        sheetVelStart + pastDeadzone(dx) / (0.40 * window.innerWidth) * SHEET_SPEED));
    }
    return;
  }
  if (!dragging || mode === 'infinity') return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  dst.theta -= dx * 0.006;                                   // horizontal = yaw
  dst.phi = Math.min(Math.max(dst.phi - dy * 0.006, 0.12), Math.PI - 0.12); // vertical = pitch
  mode = 'custom';
  updateToggleIcon();
});
// releasing keeps the prism where it is and the sheets at their set speed
const endDrag = () => { dragging = false; infinityDrag = false; };
dom.addEventListener('pointerup', endDrag);
dom.addEventListener('pointercancel', endDrag);
dom.addEventListener('wheel', e => {
  e.preventDefault();
  if (mode === 'infinity'){
    const max = blurMaxPx();
    blurDst = Math.min(max, Math.max(0, blurDst - e.deltaY * 0.004 * max));
    return;
  }
  dst.dist = Math.min(Math.max(dst.dist * (1 + Math.sign(e.deltaY) * 0.1), 4), 60);
}, { passive: false });

/* ------------------------------------------------------------------ *
 *  Cell picking: coloured = retune, blank = reset, black = dark mode
 * ------------------------------------------------------------------ */

const raycaster = new THREE.Raycaster();
const _ndc = new THREE.Vector2();
const _uvC = new THREE.Vector2();
const _uvL = new THREE.Vector2();
const _uvF = new THREE.Vector2();
let pickReady = false;    // armed by the frame loop once the infinity fill lands

// one texel from a canvas texture, mirroring the shader's uv mapping and
// CanvasTexture's flipY, so what we sample is what is drawn
function sampleTexel(canvas, u, v){
  const x = Math.floor((((u % 1) + 1) % 1) * canvas.width) % canvas.width;
  const y = Math.floor((1 - (((v % 1) + 1) % 1)) * canvas.height) % canvas.height;
  return canvas.getContext('2d').getImageData(x, y, 1, 1).data;
}

// Walk the planes front to back; the first one that draws anything decides
// what the click is. A gridline is inert ink, a black cell is the dark-mode
// switch, a white-mask fill is a coloured cell, and a point no plane draws is
// the background.
function pickAt(clientX, clientY){
  const rect = dom.getBoundingClientRect();
  _ndc.set(((clientX - rect.left) / rect.width) * 2 - 1,
           -((clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(_ndc, camera);
  for (const hit of raycaster.intersectObjects(planes.map(p => p.mesh), false)){
    const pl = hit.object.userData.plane;
    _uvC.copy(hit.uv).multiply(uCellUVS.value).add(pl.cellUVO.value);
    _uvL.copy(hit.uv).multiply(uLineUVS.value).add(pl.lineUVO.value);
    if (sampleTexel(pl.lineMap.value.image, _uvL.x, _uvL.y)[3] > 127) return { kind: 'line' };
    // the frames sit outside the plate's drift, so they need their own sample
    _uvF.copy(hit.uv).multiply(uLineUVS.value).add(pl.frameUVO.value);
    if (sampleTexel(pl.frameMap.value.image, _uvF.x, _uvF.y)[3] > 127) return { kind: 'line' };
    const px = sampleTexel(pl.mat.map.image, _uvC.x, _uvC.y);
    if (px[3] > 127) return px[0] > 127 ? { kind: 'cell', plane: pl } : { kind: 'black' };
  }
  return { kind: 'blank' };
}

// A black cell is the one square that isn't colour, so it flips the whole
// scene to its negative and back. The classes swap while the veil covers the
// screen, so the cut is never seen; darkTarget tracks where we are headed, so
// rapid clicks still land somewhere predictable.
const veil = document.getElementById('veil');
const VEIL_INK = '#0e0e0e', VEIL_PAPER = '#f2ede1';
const VEIL_SWAP_MS = 330;            // inside the keyframe plateau, in the CSS
const VEIL_BLINK_MS = 750;           // matches .veil.blink's .7s, plus a beat
let darkTarget = false;
let darkOn = false;                  // what the canvas shaders are told (uInvert)
let darkBusy = false;                // a swap is in flight; ignore further clicks
let darkTimer = 0, darkGate = 0;

// The canvas negative is in the shaders (`uInvert`), so the flip has to happen
// the moment the class flips — not when the click lands, or the two would
// disagree for the length of the veil.
function applyDark(){
  document.body.classList.toggle('dark', darkTarget);
  darkOn = darkTarget;
}

// Spam-clicking a black cell crashes the browser: every click restarts the
// veil animation and re-toggles the filters in one burst, which is a compositor
// stampede. One swap at a time, released when the blink is over.
function toggleDark(){
  if (darkBusy) return;
  darkTarget = !darkTarget;
  if (reduceMotion){
    applyDark();
    return;
  }
  darkBusy = true;
  veil.style.background = darkTarget ? VEIL_INK : VEIL_PAPER;
  veil.classList.remove('blink');
  void veil.offsetWidth;              // restart the animation
  veil.classList.add('blink');
  clearTimeout(darkTimer);
  darkTimer = setTimeout(applyDark, VEIL_SWAP_MS);
  clearTimeout(darkGate);
  darkGate = setTimeout(() => { darkBusy = false; }, VEIL_BLINK_MS);
}

dom.addEventListener('click', e => {
  if (dragMoved){ dragMoved = false; return; }     // a prism drag, not a pick
  if (mode !== 'infinity' || !pickReady) return;
  const pick = pickAt(e.clientX, e.clientY);
  if (pick.kind === 'cell') retunePalette(pick.plane.slot);
  else if (pick.kind === 'blank'){                 // absence of colour reads as clear
    resetPalette();
    prismDst = 0;                                  // ...and clears the prism...
    sheetVelDst = 0; sheetBraking = true;          // ...and brakes the sheets where they are
  }
  else if (pick.kind === 'black') toggleDark();
});

toggleBtn.addEventListener('click', () => {
  setMode((mode === 'top' || mode === 'split') ? '3d' : 'top');
});
explodeBtn.addEventListener('click', () => setMode(mode === 'split' ? 'top' : 'split'));
infinityBtn.addEventListener('click', toggleInfinity);
document.getElementById('shuffle').addEventListener('click', shuffle);

// The title (and its plate in infinity mode) is the artwork's switch. In
// infinity it is the focus-pull turntable: the first click ramps the blur to
// max and sets the artwork spinning in its own plane, the second eases it back
// to the nearest full turn and releases the blur. Outside infinity it toggles
// plate drift instead, so the blur and spin never fire there.
document.querySelector('.title').addEventListener('click', () => {
  if (mode !== 'infinity'){ toggleDrift(); return; }
  if (spinning) stopSpin();
  else { spinning = true; spinGoal = null; spinRate = 0; }
  blurDst = spinning ? blurMaxPx() : 0;
});

/* ------------------------------------------------------------------ *
 *  Resize + loop
 * ------------------------------------------------------------------ */

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.getDrawingBufferSize(_dbSize);
  rtScene.setSize(_dbSize.x, _dbSize.y);
  for (const chain of [blurChainA, blurChainB])
    chain.forEach((rt, i) =>
      rt.setSize(Math.max(1, Math.round(_dbSize.x / (2 << i))),
                 Math.max(1, Math.round(_dbSize.y / (2 << i)))));
  fitViews();
  if (mode === '3d')            { dst.dist = cur.dist = dists.d3d; }
  else if (mode === 'top')      { dst.dist = cur.dist = dists.dtop; }
  else if (mode === 'split')    { dst.dist = cur.dist = dists.dsplit; }
  else if (mode === 'infinity') { dst.dist = cur.dist = dists.dtop; }
}
window.addEventListener('resize', resize);

let prev = performance.now();
function frame(now){
  const dt = Math.min((now - prev) / 1000, 0.05);
  prev = now;

  // Snappy while dragging, slow and cinematic for the automatic transitions
  const rate = dragging ? 9.0 : 1.2;
  const k = 1 - Math.exp(-dt * rate); // frame-rate independent easing
  for (const p of ['theta', 'phi', 'dist', 'spread', 'explode']) cur[p] += (dst[p] - cur[p]) * k;
  cur.rise += (dst.rise - cur.rise) * (1 - Math.exp(-dt * 1.2)); // levitation, matched to the rotation
  cur.fill += (dst.fill - cur.fill) * (1 - Math.exp(-dt * 2.2)); // inf retract

  // Infinity mode timeline: the lines spread first, then the cells fill in.
  if (mode === 'infinity'){
    infT += dt;
    const ease = x => x * x * (3 - 2 * x);
    const clamp01 = x => Math.min(1, Math.max(0, x));
    uLineReveal.value = ease(clamp01((infT - 0.45) / 1.5));
    uCellReveal.value = ease(clamp01((infT - 2.05) / 1.5));
    pickReady = infT > 3.7;   // only clickable once the fill has landed
  } else {
    pickReady = false;
  }

  paletteTick(dt);   // palette crossfade from the last click
  titleTick(dt);     // title gradient drift

  // Focus pull: eased everywhere (max while the title switch spins, trimmed by
  // the wheel, back to sharp when infinity mode is left).
  blurCur += (blurDst - blurCur) * (1 - Math.exp(-dt * 1.6));

  // Iridescent prism: exact while the finger is down, then it stays where it
  // was left (leaving infinity resets it). The title's gradient follows it.
  if (infinityDrag) prismCur = prismDst;
  else prismCur += (prismDst - prismCur) * (1 - Math.exp(-dt * 2.6));
  uPrism.value = prismCur;
  if (Math.abs(prismCur - titlePrism) > 0.002){
    titlePrism = prismCur;
    applyTitlePalette();
  }

  // Sliding sheets: the horizontal drag sets a speed and the sheets keep
  // moving at it — no decay on release, so they hold the direction and pace
  // you set. A blank click brakes them smoothly where they are; leaving
  // infinity whizzes the offset back to registration and stops them.
  if (sheetReturning){
    sheetVel = 0;
    sheetBraking = false;
    const speed = Math.min(14, Math.max(2.5, Math.abs(sheetOffset) * 6));
    const step = speed * dt;
    if (Math.abs(sheetOffset) <= step){ sheetOffset = 0; sheetReturning = false; }
    else sheetOffset -= Math.sign(sheetOffset) * step;
  } else {
    if (infinityDrag) sheetVel = sheetVelDst;
    else if (sheetBraking){
      sheetVel += (0 - sheetVel) * (1 - Math.exp(-dt * 3));
      if (Math.abs(sheetVel) < 0.02){ sheetVel = 0; sheetBraking = false; }
    }
    sheetOffset += sheetVel * dt;
  }

  // Plate drift: each layer slides its whole print along its own path. The
  // displacement is in grid cells, but the two maps tile differently — the
  // cell map K cells per UV, the line map one — so the same world movement
  // needs a different denominator per uniform; fills and ink stay locked.
  driftAmt += ((drifting ? 1 : 0) - driftAmt) * (1 - Math.exp(-dt * 1.3));
  if (!drifting && driftAmt < 0.002) driftAmt = 0;
  if (driftAmt > 0) driftT += dt;
  // The fixed painting frame is on whenever drift is engaged outside infinity,
  // and switches on at once: at the moment the drift starts the plates are
  // still exactly on register, so it lands invisibly under their own frames,
  // whereas easing it in leaves the boundary unframed for a beat as the plates
  // move off (the fade-out-then-in the eye catches). It holds until the plates
  // are fully home, where it again coincides with their frames, and fades
  // across the infinity boundary, where the composition is changing anyway.
  const frameOn = mode !== 'infinity' && (drifting || driftAmt > 0.01);
  if (frameOn) uFrameAmt.value = 1;
  else if (uFrameAmt.value > 0){
    uFrameAmt.value += (0 - uFrameAmt.value) * (1 - Math.exp(-dt * 2.2));
    if (uFrameAmt.value < 0.002) uFrameAmt.value = 0;
  }

  // Turntable: spinning holds the focus pull at max and turns the artwork in
  // its own plane — infinity mode only, where the switch is started and where
  // the composition faces the camera. Switching off eases the angle back to
  // the nearest full turn, so it always lands on the default orientation.
  if (spinning && mode === 'infinity'){
    blurDst = blurMaxPx();
    spinRate += (SPIN_RATE - spinRate) * (1 - Math.exp(-dt * 1.5));
    spinAngle += spinRate * dt;
  } else if (spinGoal !== null){
    spinRate = 0;
    spinAngle += (spinGoal - spinAngle) * (1 - Math.exp(-dt * 2.2));
    if (Math.abs(spinGoal - spinAngle) < 0.002){ spinAngle = spinGoal; spinGoal = null; }
  }

  // The conveyor: float the current composition up and out of frame, then swap
  // in the next one while the frame is empty and let it rise into place. This
  // runs before the camera is applied, so a swap takes effect on the very frame
  // it happens and the new composition is placed against the camera it will
  // actually be seen with — never a stale one, never already part on screen.
  if (shufflePhase === 'out'){
    shuffleT += dt;
    const t = Math.min(1, shuffleT / 0.7);
    exitRise = 1 - (1 - t) * (1 - t);        // ease-out, matching the entrance pace
    setArtworkFade(true, 1 - t);             // and dissolve on the way out
    if (t >= 1) swapIn();
  } else if (shufflePhase === 'in' && cur.rise < 0.02){
    shufflePhase = 'idle';
  }

  applyCamera(cur);
  updateLights();

  const s = cur.spread, e = cur.explode, rise = cur.rise;
  const ax = explodeAxis();
  // The plane always shows half the outer frame line past the composition's
  // edge, so the border keeps its full weight while infinity retracts (and the
  // artwork never changes size). That half line lands on the line texture's own
  // wrapped edge, so the ring reads as the border rather than the next square.
  const span = 1 + cur.fill * (dists.fillScale - 1) + frameW / 1024;
  uS.value = span;
  uFill.value = cur.fill;            // gates the margin cell clip (see the shader)
  // half the frame line, in world units — the always-drawn region matches the
  // ink, which is drawn at full `frameW`
  uFrame.value = frameW / 512;

  // Cell/line tiling. The plane shows the central `span` squares of the
  // K-square tile (so one square = SIZE world units, no zoom), centred on the
  // tile, in every view.
  const cellR = span / TILE_K;
  const lineR = span;
  uCellUVS.value.set(cellR, cellR);
  uLineUVS.value.set(lineR, lineR);
  // Each plane's offset is the shared centring plus its own slide; a plate
  // moves fills and gridlines by the same world distance, and the two maps
  // tile at different scales — the cell map K cells per UV, the line map one —
  // so the same displacement takes a different UV delta per uniform. The maps
  // repeat, so the slide is unbounded and never shows a plane edge.
  const cellC = 0.5 - 0.5 * cellR, lineC = 0.5 - 0.5 * lineR;
  for (const pl of planes){
    const slideC = (pl.i - 1) * sheetOffset / (SIZE * TILE_K);
    const slideL = (pl.i - 1) * sheetOffset / SIZE;
    // plate drift adds each layer's own path on top, in grid cells
    let dx = 0, dy = 0;
    if (driftAmt > 0 && driftPaths){
      const d = driftPaths[pl.i];
      dx = d.ax * driftAmt * Math.sin(TAU * (d.fx * driftT + d.px));
      dy = d.ay * driftAmt * Math.sin(TAU * (d.fy * driftT + d.py));
    }
    pl.cellUVO.value.set(cellC + slideC + dx / TILE_K, cellC + dy / TILE_K);
    pl.lineUVO.value.set(lineC + slideL + dx, lineC + dy);
    // the pane frames ride the slide (they are part of the sheets' registration)
    // but never the drift, so the painting stays framed while the grid moves
    pl.frameUVO.value.set(lineC + slideL, lineC);
  }

  for (const pl of planes){
    const off = pl.i - 1;                        // -1, 0, 1 along the layout axis
    const flat = s * (1 - e);                    // rotation / fan amount
    const bx = pl.pose.x * s * (1 - e) + off * ax.dx * e;
    const by = pl.pose.y * s * (1 - e) + off * ax.dy * e;
    const bz = pl.depth * 0.014 + pl.pose.z * flat;
    // stagger the entrance a little so the grids levitate in sequence; the exit
    // floats the same lift back out. Both travel along the camera's own up axis,
    // so they leave/arrive straight up the screen whatever the view.
    const along = (exitLift + pl.i * 0.9) * exitRise - (LIFT + pl.i * 0.9) * rise;
    pl.mesh.position.set(
      bx + _camUp.x * along,
      by + _camUp.y * along,
      bz + _camUp.z * along);
    pl.mesh.rotation.set(pl.pose.rx * flat, pl.pose.ry * flat, pl.pose.rz * flat + spinAngle);
    pl.mesh.scale.set(span, span, 1);
  }

  renderScene();

  requestAnimationFrame(frame);
}

resize();
shuffle();

// optional deterministic override: ?view=top | 3d | split | infinity
const viewParam = new URLSearchParams(location.search).get('view');
if (viewParam === 'infinity'){
  enterInfinity();
  Object.assign(cur, dst);
} else if (viewParam === 'top' || viewParam === '3d' || viewParam === 'split'){
  setMode(viewParam);
  Object.assign(cur, dst);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
